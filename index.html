<style>
:root{--bg:#F2F5F9;--card:#fff;--ink:#16202E;--mut:#6B7686;--ac:#2F4BDB;--acx:#fff;--in:#12805C;--out:#C23B3B;--ln:#DDE3EC;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151D;--card:#19212C;--ink:#E8EDF4;--mut:#93A0B2;--ac:#7B93FF;--acx:#10151D;--in:#4CC9A0;--out:#FF7B7B;--ln:#2A3442;color-scheme:dark}}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Onest,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px}
main{max-width:560px;margin:0 auto;padding:16px}
h2{font-size:26px;margin:8px 0 14px;letter-spacing:-.02em}
h3{font-size:16px;margin:22px 0 8px;color:var(--mut);font-weight:500}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;margin-bottom:8px}
textarea{min-height:160px;resize:vertical}
input[type=checkbox]{width:22px;height:22px;margin:0;flex:none}
.btn{font:inherit;font-weight:700;background:var(--ac);color:var(--acx);border:0;border-radius:10px;padding:10px 16px;cursor:pointer}
.btn.g{background:transparent;color:var(--ac);border:1px solid var(--ln)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.moods,.seg,.nav,.add,.two{display:flex;gap:8px;margin-bottom:8px}
.add input,.two>*{margin:0;flex:1}
.mood{font-size:24px;background:var(--bg);border:1px solid var(--ln);border-radius:10px;flex:1;padding:6px;cursor:pointer}
.mood.on,.seg .on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 16%,transparent)}
.seg button{flex:1;font:inherit;padding:9px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--ink);cursor:pointer}
.nav{align-items:center;justify-content:space-between}
.nav button{font-size:20px;width:44px;height:40px;border:1px solid var(--ln);background:var(--card);color:var(--ink);border-radius:10px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px}
.day{font:inherit;font-size:12px;color:var(--mut);background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.day b{font-size:17px;color:var(--ink)}
.day i{font-style:normal;font-size:11px;min-height:14px;color:var(--ac)}
.day.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 16%,transparent)}
.day.td b{text-decoration:underline}
.task,.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--ln)}
.task span,.row .t{flex:1;min-width:0;overflow-wrap:anywhere}
.dn{text-decoration:line-through;color:var(--mut)}
.x{border:0;background:transparent;color:var(--mut);font-size:16px;padding:6px 8px;cursor:pointer}
.mut{color:var(--mut);font-size:14px;margin:6px 0}
.bal{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:0}
.in{color:var(--in)}.out{color:var(--out)}
.bar{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;margin:8px 0}
.bar div{height:100%;background:var(--ac)}
.ent{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;font:inherit;font-size:12px;color:var(--mut);background:transparent;border:0;padding:6px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:22px}
nav button.on{color:var(--ac);font-weight:700}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.s{opacity:1}
body{padding-bottom:104px;background:radial-gradient(circle at 12% -5%,color-mix(in srgb,var(--ac) 26%,transparent),transparent 42%),radial-gradient(circle at 105% 35%,color-mix(in srgb,var(--in) 20%,transparent),transparent 40%),var(--bg);background-attachment:fixed}
.card{background:color-mix(in srgb,var(--card) 68%,transparent);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border:1px solid color-mix(in srgb,#fff 35%,var(--ln));box-shadow:0 8px 24px rgba(20,30,60,.08),inset 0 1px 0 rgba(255,255,255,.5)}

.ic::after{content:"";position:absolute;left:3px;right:3px;top:2px;height:45%;border-radius:12px 12px 20px 20px;background:linear-gradient(rgba(255,255,255,.65),rgba(255,255,255,.05))}

.mood,.ck.ok,.ck.no{box-shadow:inset 0 1px 1px rgba(255,255,255,.6),inset 0 -2px 4px rgba(0,0,0,.15),0 3px 8px rgba(0,0,0,.15)}
.top{max-width:560px;margin:0 auto;padding:12px 16px 0;display:flex;align-items:center;gap:10px}
.top small{display:block;color:var(--mut);font-size:12px;line-height:1.2}
.md{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;flex:none;border-radius:12px;font-weight:800;font-size:15px;letter-spacing:.5px;color:#fff;background:linear-gradient(145deg,#6EA8FF,#2F4BDB 60%,#1B2E9E);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.7),inset 0 -4px 6px rgba(0,0,0,.25),0 6px 12px rgba(47,75,219,.4);text-shadow:0 1px 2px rgba(0,0,0,.4)}
.md.big{width:56px;height:56px;font-size:21px;border-radius:18px}
#ring{position:fixed;inset:0;z-index:99;background:var(--bg);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}#ring[hidden]{display:none}
#ring .card{width:100%;max-width:360px}#ring .btn{width:100%;margin-top:10px}
.pg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
.pb{font:inherit;font-size:14px;padding:8px 0;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--ink);cursor:pointer}

.prow{display:flex;align-items:center;gap:12px;width:100%;font:inherit;color:var(--ink);background:transparent;border:0;border-top:1px solid var(--ln);padding:10px 0;text-align:left;cursor:pointer}
.prow i{font-style:normal;font-size:13px;color:var(--mut)}
.prow span.f{flex:1;overflow-wrap:anywhere}
.ck{width:28px;height:28px;flex:none;border-radius:50%;border:2px solid var(--ln);display:inline-flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;background:transparent;color:var(--acx);padding:0;cursor:pointer}
.ck.ok{background:var(--in);border-color:var(--in)}.ck.no{background:var(--out);border-color:var(--out)}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--ln);margin:4px 0}
.dot.f{background:var(--in);border-color:var(--in)}.dot.p{border-color:var(--in);background:linear-gradient(90deg,var(--in) 50%,transparent 50%)}
.bars{display:flex;gap:8px;margin-top:8px}.bars>div{flex:1;text-align:center;font-size:12px;color:var(--mut)}
.bc{height:90px;background:var(--bg);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden;margin-bottom:4px}.bc div{width:100%;background:var(--ac)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:8px 0}
.ch{font-size:12px;color:var(--mut);text-align:center}
.cd{font:inherit;font-size:12px;color:var(--ink);background:var(--bg);border:1px solid transparent;border-radius:12px;padding:4px 0;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.cd span{font-size:20px;line-height:1.3;color:var(--mut)}
.cd.on{border-color:var(--ac)}.cd.td{font-weight:700;color:var(--ac)}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--ln);border-radius:20px;padding:4px 10px;margin:0 6px 6px 0;font-size:14px}
#login{position:fixed;inset:0;z-index:98;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}#login[hidden]{display:none}#login .card{width:100%;max-width:380px;text-align:center}#login .btn{width:100%;margin-top:8px}
.pw{position:relative}.pw input{padding-right:50px}.eye{position:absolute;right:4px;top:0;height:45px;width:44px;border:0;background:transparent;font-size:20px;cursor:pointer}
#login .card .card{box-shadow:none;margin-bottom:12px}

<script>
const $=s=>document.querySelector(s);
let S={diary:{},tasks:{},tx:[],goals:[],debts:[],pr:{},qr:{},qh:{},qz:{},qzl:{},dg:[],dgd:{},al:[],sh:[],bk:[],nb:[],qd:[],zk:[],zc:{},zg:{},rl:[],qs:{}};
try{const r=localStorage.getItem('kd1');if(r)S=Object.assign(S,JSON.parse(r))}catch(x){}
const save=()=>{try{localStorage.setItem('kd1',JSON.stringify(S))}catch(x){}if(DB)push()};
const e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=ymd(new Date());
const money=n=>Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' so’m';
const num=v=>parseFloat(String(v).replace(/\s/g,'').replace(',','.'))||0;
const MON=['yan','fev','mar','apr','may','iyun','iyul','avg','sen','okt','noy','dek'];
const DS=['Du','Se','Chor','Pay','Ju','Sha','Yak'];
const PR=['Tahajjud','Bomdod','Peshin','Asr','Shom','Xufton'];
const MN=['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentabr','Oktabr','Noyabr','Dekabr'];
const score=k=>{const t=S.tasks[k]||[],p=S.pr[k]||{};return (PR.filter(x=>p[x]).length+t.filter(x=>x.d).length)/(6+t.length)};
const CAT={out:['Oziq-ovqat','Transport','Uy-joy','Kiyim','Sog’liq','Ko’ngilochar','Boshqa'],in:['Maosh','Biznes','Sovg’a','Boshqa']};
const mondayOf=s=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return d};
let tab='home',dm='d',wm='w',qb='q',bo=0,qm='r',qj=0,qe=0,hm=today.slice(0,7),ddate=today,cm=today.slice(0,7),q='',tq='',wstart=mondayOf(today),wsel=today,txType='out',gmode='goal';
const CO={home:['#79DB86','#2C9A4B'],diary:['#45C9AE','#0D7A68'],wal:['#8EDB6A','#3A9A36'],quran:['#2FB89A','#0A6E5E'],acc:['#58C98A','#147A52']};
const sv=b=>'<svg viewBox="0 0 32 32" aria-hidden="true">'+b+'</svg>';
const IC={home:sv('<rect x="8" y="7" width="16" height="19" rx="3" fill="#fff"/><rect x="11" y="4" width="2" height="5" rx="1" fill="#E8B64A"/><rect x="15" y="4" width="2" height="5" rx="1" fill="#E8B64A"/><rect x="19" y="4" width="2" height="5" rx="1" fill="#E8B64A"/><path d="M11 14l1.6 1.6 3-3M11 20l1.6 1.6 3-3" stroke="#2E9E4F" stroke-width="2" fill="none" stroke-linecap="round"/><rect x="18" y="13" width="4" height="1.8" rx=".9" fill="#BFD9C8"/><rect x="18" y="19" width="4" height="1.8" rx=".9" fill="#BFD9C8"/>'),
diary:sv('<g transform="rotate(45 16 16)"><rect x="13" y="4" width="6" height="19" rx="1.5" fill="#F2C35B"/><rect x="13" y="4" width="6" height="4" rx="1.5" fill="#F4F4F4"/><path d="M13 23h6l-3 6z" fill="#F6E3B8"/><path d="M15 27.2h2L16 29z" fill="#6b4b12"/></g>'),
wal:sv('<rect x="4" y="10" width="24" height="17" rx="4" fill="#fff"/><path d="M6 10l15-5 2 5z" fill="#F2C35B"/><rect x="18" y="15" width="10" height="7" rx="3.5" fill="#2E9E4F"/><circle cx="22.5" cy="18.5" r="1.5" fill="#fff"/><circle cx="10.5" cy="19" r="4.2" fill="#F2C35B"/><path d="M10.5 16.6v4.8M8.9 18h3.2M8.9 20h3.2" stroke="#B7821F" stroke-width="1" fill="none"/>'),
quran:sv('<path d="M16 9c-3-2-7-2-10-1v16c3-1 7-1 10 1 3-2 7-2 10-1V8c-3-1-7-1-10 1z" fill="#fff"/><path d="M16 9v16" stroke="#2E9E4F" stroke-width="1.5"/><path d="M9 12h4M9 15.5h4M19 12h4M19 15.5h4" stroke="#8CCBA3" stroke-width="1.4" stroke-linecap="round"/>'),
acc:sv('<circle cx="16" cy="12" r="5.5" fill="#fff"/><path d="M5 28c0-6.5 5-10 11-10s11 3.5 11 10z" fill="#F2C35B"/>'),
clock:sv('<circle cx="8" cy="7" r="3.2" fill="#F2C35B"/><circle cx="24" cy="7" r="3.2" fill="#F2C35B"/><circle cx="16" cy="17" r="10" fill="#fff" stroke="#2E9E4F" stroke-width="2"/><path d="M16 11v6l4 2.5" stroke="#1B6E4A" stroke-width="2" fill="none" stroke-linecap="round"/>'),
folder:sv('<path d="M4 8h8l3 3h13v16H4z" fill="#F2C35B"/><rect x="4" y="13" width="24" height="14" rx="2" fill="#fff"/><path d="M12 20l3 3 5.5-6" stroke="#2E9E4F" stroke-width="2.2" fill="none" stroke-linecap="round"/>')};
const TABS=[['home','🏠','Bugun'],['diary','📖','Kundalik'],['plan','🗓️','Reja'],['wal','👛','Hamyon'],['goal','🎯','Maqsad']];
TABS.splice(4,1);TABS.splice(2,1);TABS.push(['quran','','Mutolaa']);TABS.push(['acc','👤','Hisob']);
function toast(m){const t=$('#toast');t.textContent=m;t.className='s';setTimeout(()=>t.className='',1400)}
function go(){
 $('#nav').innerHTML=TABS.map(t=>`<button class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';go();scrollTo(0,0)"><span class="ic" style="--c1:${CO[t[0]][0]};--c2:${CO[t[0]][1]}">${IC[t[0]]}</span>${t[2]}</button>`).join('');
 $('#main').innerHTML={home:vHome,diary:()=>dseg()+(dm=='p'?vPlan():dm=='a'?vAlarm():vDiary()),wal:()=>wseg()+(wm=='g'?(gmode='goal',vGoal()):wm=='d'?(gmode='debt',vGoal()):wm=='s'?vShop():vWal()),stat:vStats,quran:()=>qseg()+(qb=='b'?vBooks():vQuran()),acc:vAcc}[tab]();banner();
}
const dseg=()=>`<div class="seg"><button class="${dm=='d'?'on':''}" onclick="dm='d';go()">Kundalik</button><button class="${dm=='p'?'on':''}" onclick="dm='p';go()">Haftalik reja</button><button class="${dm=='a'?'on':''}" onclick="dm='a';go()">Budilnik</button></div>`;
const wseg=()=>`<div class="seg">${[['w','Hamyon'],['s','Bozorlik'],['d','Qarz'],['g','Maqsad']].map(([k,l])=>`<button class="${wm==k?'on':''}" onclick="wm='${k}';go()">${l}</button>`).join('')}</div>`;
/* Bugun */
const sh=n=>{const d=new Date(wsel+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d)};
function sd(k){wsel=k;wstart=mondayOf(k);hm=k.slice(0,7);go()}
function hmv(n){const [y,m]=hm.split('-').map(Number),d=new Date(y,m-1+n,1);hm=d.getFullYear()+'-'+pad(d.getMonth()+1);go()}
function tPr(p,k){k=k||wsel;const o=S.pr[k]=S.pr[k]||{};o[p]=((o[p]||0)+1)%4;save();go()}
function vHome(){
 const k=wsel,d=new Date(k+'T00:00:00'),WD=['Yakshanba','Dushanba','Seshanba','Chorshanba','Payshanba','Juma','Shanba'];
 const pr=S.pr[k]||{},tl=S.tasks[k]||[],past=k<today,pd=PR.filter(p=>pr[p]).length,td=tl.filter(t=>t.d).length;
 const dy=S.diary[k]||{},tx=S.tx.filter(x=>x.d==k),sm=t=>tx.filter(x=>x.t==t).reduce((a,x)=>a+x.a,0);
 return `<div class="nav"><button onclick="sd(sh(-1))" aria-label="Oldingi kun">‹</button><div style="text-align:center"><h2 style="margin:0">${WD[d.getDay()]}</h2><div class="mut" style="margin:0">${d.getDate()}-${MON[d.getMonth()]}${k==today?' · bugun':''}</div></div><button onclick="sd(sh(1))" aria-label="Keyingi kun">›</button></div>
 ${k!=today?`<button class="btn g" style="width:100%;margin-bottom:12px" onclick="sd(today)">Bugunga qaytish</button>`:''}
 ${nsec(k,past)}${zsec(k)}${tsec(k,past)}
 ${tx.length?`<div class="card"><b>Hamyon</b><p class="mut">Daromad: +${cline(bc(tx.filter(x=>x.t=='in'),x=>x.a),'in')} · Xarajat: −${cline(bc(tx.filter(x=>x.t=='out'),x=>x.a),'out')} (${tx.length} ta yozuv)</p></div>`:''}
 ${dcal()}${dayInfo(k)}`}
function dcal(){
 const [y,mo]=hm.split('-').map(Number),n=new Date(y,mo,0).getDate(),off=(new Date(y,mo-1,1).getDay()+6)%7;
 let c=DS.map(d=>`<div class="ch">${d}</div>`).join('')+'<i></i>'.repeat(off);
 for(let i=1;i<=n;i++){const k=hm+'-'+pad(i),s=score(k);c+=`<button class="cd${k==wsel?' on':''}${k==today?' td':''}" onclick="sd('${k}')"><span class="dot ${s>=1?'f':s>0?'p':''}${S.qd.some(x=>x.d==k&&!x.done)?' q':''}"></span>${i}</button>`}
 return `<div class="card"><div class="nav"><button onclick="hmv(-1)" aria-label="Oldingi oy">‹</button><b>${MN[mo-1]} ${y}</b><button onclick="hmv(1)" aria-label="Keyingi oy">›</button></div><div class="cal">${c}</div><div class="mut">To’liq to’ldirilgan kun — to’la nuqta, qisman — yarim nuqta. Qizil halqa: shu kunda qazo bor. Kunni bossangiz, tepada o’sha kun ochiladi.</div></div>`}
/* Maqsad, qazo, Qur’on */
const QZ=['Bomdod','Peshin','Asr','Shom','Xufton','Vitr'],qg=p=>S.qz[p]||{t:0,d:0};
const js=n=>n==1?1:20*n-18,je=n=>n==30?604:js(n+1)-1;
function addDg(){const v=$('#dgn').value.trim();if(!v)return;S.dg.push({id:Date.now(),x:v});save();go()}
function tDg(id){const o=S.dgd[wsel]=S.dgd[wsel]||{};o[id]=o[id]?0:1;save();go()}
function rmDg(id){S.dg=S.dg.filter(x=>x.id!=id);save();go()}
function dgCard(k,past){const g=S.dgd[k]||{},dn=S.dg.filter(x=>g[x.id]).length;
 return `<div class="card"><b>Kunlik maqsadlar</b> <span class="mut">${dn}/${S.dg.length}</span>${S.dg.map(x=>{const o=g[x.id];return `<div class="prow"><button class="ck ${o?'ok':past?'no':''}" onclick="tDg(${x.id})" aria-label="Belgilash">${o?'✓':past?'✕':''}</button><span class="f ${o?'dn':''}">${e(x.x)}</span><i>${o?'bajarildi':past?'bajarilmadi':''}</i><button class="x" onclick="rmDg(${x.id})" aria-label="O’chirish">✕</button></div>`}).join('')}<div class="add" style="margin-top:8px"><input id="dgn" placeholder="Har kuni takrorlanadigan maqsad" onkeydown="if(event.key=='Enter')addDg()"><button class="btn" onclick="addDg()">Qo’shish</button></div>${S.dg.length?'':'<p class="mut">Masalan: 1 sahifa Qur’on, Mutolaa, Zikr.</p>'}</div>`}
function qRead(p,n){const o=S.qz[p]=S.qz[p]||{t:0,d:0};if((n>0&&o.d>=o.t)||(n<0&&o.d<=0))return;o.d+=n;S.qzl[wsel]=Math.max(0,(S.qzl[wsel]||0)+n);save();go()}
function qSet(p,v){const o=S.qz[p]=S.qz[p]||{t:0,d:0};o.t=Math.max(o.d,Math.floor(num(v)));save();go()}
function qzCard(){let tl=0,dn=0;QZ.forEach(p=>{const o=qg(p);tl+=o.t;dn+=o.d});
 return `<div class="card"><b>Umumiy son bo’yicha</b> <span class="mut">qoldi ${tl-dn} · bugun ${S.qzl[wsel]||0} ta o’qildi</span>${QZ.map(p=>{const o=qg(p);return qe?`<div class="prow"><div style="flex:1">${p}</div><input type="number" min="0" value="${o.t}" style="width:90px;margin:0" onchange="qSet('${p}',this.value)"></div>`:`<div class="prow"><div style="flex:1"><div>${p} <i>${o.d}/${o.t}</i></div><div class="bar" style="margin:4px 0 0"><div style="width:${o.t?o.d/o.t*100:0}%"></div></div></div><button class="btn g" style="padding:6px 10px;font-size:14px" onclick="qRead('${p}',1)">o’qildi</button><button class="x" onclick="qRead('${p}',-1)" aria-label="Bekor qilish">↩</button></div>`}).join('')}<button class="btn g" style="margin-top:8px" onclick="qe=!qe;go()">${qe?'Tayyor':'Qazo sonini kiritish'}</button>${tl?'':'<p class="mut">Avval har bir namoz bo’yicha qazo sonini kiriting.</p>'}</div>`}
function qTog(p){if(qm=='r'){if(S.qr[p])delete S.qr[p];else S.qr[p]=1}else{const v=((S.qh[p]||0)+1)%3;if(v)S.qh[p]=v;else delete S.qh[p]}save();go()}
function qAll(n){const a=[];for(let i=js(n);i<=je(n);i++)a.push(i);if(qm=='r'){const f=a.every(i=>S.qr[i]);a.forEach(i=>f?delete S.qr[i]:S.qr[i]=1)}else{const f=a.every(i=>S.qh[i]==2);a.forEach(i=>f?delete S.qh[i]:S.qh[i]=2)}save();go()}
const SU=['Fotiha', 'Baqara', 'Oli Imron', 'Niso', 'Moida', 'An’om', 'A’rof', 'Anfol', 'Tavba', 'Yunus', 'Hud', 'Yusuf', 'Ra’d', 'Ibrohim', 'Hijr', 'Nahl', 'Isro', 'Kahf', 'Maryam', 'Toha', 'Anbiyo', 'Haj', 'Mu’minun', 'Nur', 'Furqon', 'Shuaro', 'Naml', 'Qasas', 'Ankabut', 'Rum', 'Luqmon', 'Sajda', 'Ahzob', 'Saba', 'Fotir', 'Yosin', 'Soffot', 'Sod', 'Zumar', 'G’ofir', 'Fussilat', 'Shuro', 'Zuxruf', 'Duxon', 'Josiya', 'Ahqof', 'Muhammad', 'Fath', 'Hujurot', 'Qof', 'Zoriyot', 'Tur', 'Najm', 'Qamar', 'Rahmon', 'Voqe’a', 'Hadid', 'Mujodala', 'Hashr', 'Mumtahana', 'Saff', 'Jum’a', 'Munofiqun', 'Tag’obun', 'Taloq', 'Tahrim', 'Mulk', 'Qalam', 'Hoqqa', 'Ma’orij', 'Nuh', 'Jinn', 'Muzzammil', 'Muddassir', 'Qiyoma', 'Insan', 'Mursalot', 'Naba', 'Noziot', 'Abasa', 'Takvir', 'Infitor', 'Mutaffifin', 'Inshiqoq', 'Buruj', 'Toriq', 'A’lo', 'G’oshiya', 'Fajr', 'Balad', 'Shams', 'Layl', 'Zuho', 'Sharh', 'Tin', 'Alaq', 'Qadr', 'Bayyina', 'Zalzala', 'Odiyot', 'Qori’a', 'Takasur', 'Asr', 'Humaza', 'Fil', 'Quraysh', 'Moun', 'Kavsar', 'Kofirun', 'Nasr', 'Masad', 'Ixlos', 'Falaq', 'Nos'];
IC.heart=sv('<path d="M16 28C6 20 3 14 3 9.5A6.5 6.5 0 0 1 16 8a6.5 6.5 0 0 1 13 1.5C29 14 26 20 16 28z" fill="#fff"/><path d="M16 12v9M12 16.5h8" stroke="#2E9E4F" stroke-width="2" stroke-linecap="round"/>');
const heartSvg=p=>`<svg viewBox="0 0 32 30" width="64" height="60" aria-hidden="true"><defs><linearGradient id="hg" x1="0" y1="1" x2="0" y2="0"><stop offset="${p}%" stop-color="#1F9E5A"/><stop offset="${p}%" style="stop-color:var(--ln)"/></linearGradient></defs><path d="M16 28C6 20 3 14 3 9.5A6.5 6.5 0 0 1 16 8a6.5 6.5 0 0 1 13 1.5C29 14 26 20 16 28z" fill="url(#hg)" stroke="#1F9E5A" stroke-width="1.2"/></svg>`;
function qSu(n){const nv=((S.qs[n]||0)+1)%3;if(nv)S.qs[n]=nv;else delete S.qs[n];save();go()}
function addRl(){const p=Math.floor(num($('#rpb').value)),n=Math.floor(num($('#rpn').value));if(p<1||p>604||n<1){toast('Bet (1-604) va takror sonini kiriting');return}S.rl.push({id:Date.now(),d:$('#rpd').value||today,p,n});save();go();toast('Yozildi')}
function rmRl(id){S.rl=S.rl.filter(x=>x.id!=id);save();go()}
function qoBody(){let h='<div class="jg">';for(let n=1;n<=30;n++){const t=je(n)-js(n)+1;let r=0;for(let i=js(n);i<=je(n);i++)if(S.qr[i])r++;h+=`<button class="jb${qj==n?' on':''}${r==t?' full':''}" onclick="qj=${qj==n?0:n};go()"><b>${n}</b><i style="width:${r/t*100}%"></i></button>`}h+='</div>';
 if(qj){const t=je(qj)-js(qj)+1,all=Array.from({length:t},(_,i)=>js(qj)+i);h+=`<div class="mut">${qj}-juz · ${js(qj)}–${je(qj)} betlar. Betni bossangiz, o’qilgan bo’ladi.</div><div class="pg">${all.map(p=>`<button class="pb ${S.qr[p]?'r':''}" onclick="qTog(${p})">${p}</button>`).join('')}</div><button class="btn g" onclick="qAll(${qj})">${all.every(p=>S.qr[p])?'Juzni bekor qilish':'Butun juzni belgilash'}</button>`}
 else h+='<div class="mut">Juz raqamini bossangiz, uning betlari ochiladi. Pastdagi chiziq o’qilgan qismni ko’rsatadi.</div>';return h}
function qhBody(){return `<div class="mut" style="margin-top:0">Sura nomini bossangiz: yod olingan. Yana bossangiz: yod olinmoqda. Yana bossangiz: bekor.</div><div class="lg"><span><i class="md6 ok"></i>yod olingan</span><span><i class="md6 late"></i>yod olinmoqda</span></div><div class="sg">${SU.map((nm,i)=>{const v=S.qs[i+1]||0;return `<button class="sb ${v==1?'h':v==2?'p':''}" onclick="qSu(${i+1})"><small>${i+1}</small>${nm}</button>`}).join('')}</div>`}
function qtBody(){const m={};S.rl.forEach(x=>{m[x.p]=(m[x.p]||0)+x.n});const top=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,8),tot=S.rl.reduce((a,x)=>a+x.n,0),mx=top.length?top[0][1]:1;

let T0=0,VB=0,TB=null,TS=null,GV=1;
const TONES={radial:'Radial uslubida',bell:'Qo’ng’iroq',chime:'Yumshoq arpeggio',classic:'Klassik signal',custom:'O’z faylim'};
const TN=()=>{try{return localStorage.getItem('kdtn')||'radial'}catch(x){return'radial'}};
function note(f,t,d,ty,g,hm){const T=AU.currentTime+t,o=AU.createOscillator(),v=AU.createGain();o.type=ty||'sine';o.frequency.value=f;v.gain.setValueAtTime(0,T);v.gain.linearRampToValueAtTime((g||.3)*GV,T+.01);v.gain.exponentialRampToValueAtTime(.0001,T+d);o.connect(v);v.connect(AU.destination);o.start(T);o.stop(T+d+.05);
 if(hm){const o2=AU.createOscillator(),v2=AU.createGain();o2.type='sine';o2.frequency.value=f*hm;v2.gain.setValueAtTime(0,T);v2.gain.linearRampToValueAtTime((g||.3)*GV*.35,T+.005);v2.gain.exponentialRampToValueAtTime(.0001,T+d*.5);o2.connect(v2);v2.connect(AU.destination);o2.start(T);o2.stop(T+d)}}
function cyc(id){
 if(id=='radial'){const n=[523.25,659.25,783.99,880,783.99,659.25,587.33,523.25];n.forEach((f,i)=>note(f,i*.2,.9,'sine',.35,4));n.slice(0,4).forEach((f,i)=>note(f,1.8+i*.2,.9,'sine',.3,4));return 3.2}
 if(id=='bell'){[0,1.1].forEach(T=>[1,2.76,5.4].forEach((m,j)=>note(880*m,T,1.6/(j+1),'sine',.25/(j+1))));return 2.4}
 if(id=='chime'){[523.25,659.25,783.99,1046.5,783.99,659.25].forEach((f,i)=>note(f,i*.25,.6,'triangle',.3));return 2.0}
 [0,.35].forEach(t=>note(880,t,.25,'square',.18));return 1.2}
function startTone(){try{AU=AU||new(window.AudioContext||window.webkitAudioContext)();AU.resume();T0=Date.now();const id=TN();
 if(id=='custom'&&TB){TS=AU.createBufferSource();TS.buffer=TB;TS.loop=true;const gn=AU.createGain();gn.gain.setValueAtTime(.3,AU.currentTime);gn.gain.linearRampToValueAtTime(1,AU.currentTime+20);TS.connect(gn);gn.connect(AU.destination);TS.start()}
 else{const step=()=>{GV=Math.min(1,.25+(Date.now()-T0)/20000);BT=setTimeout(step,cyc(id==='custom'?'radial':id)*1000)};step()}}catch(x){}}
function stopTone(){clearTimeout(BT);if(TS){try{TS.stop()}catch(x){}TS=null}}
async function loadTone(){try{const d=localStorage.getItem('kdtonef');if(!d)return;AU=AU||new(window.AudioContext||window.webkitAudioContext)();TB=await AU.decodeAudioData(await (await fetch(d)).arrayBuffer())}catch(x){TB=null}}
async function toneFile(inp){const f=inp.files[0];if(!f)return;if(f.size>1.5e6){toast('Fayl 1,5 MB dan kichik bo’lsin');return}const r=new FileReader();r.onload=async()=>{try{localStorage.setItem('kdtonef',r.result);localStorage.setItem('kdtn','custom');await loadTone();go();toast('Ovoz qo’yildi')}catch(x){toast('Saqlab bo’lmadi (fayl katta)')}};r.readAsDataURL(f)}
function setTone(k){try{localStorage.setItem('kdtn',k)}catch(x){}go()}
async function prevTone(){try{AU=AU||new(window.AudioContext||window.webkitAudioContext)();await AU.resume();if(TN()=='custom'&&!TB)await loadTone()}catch(x){}stopTone();GV=1;

/* Maqsad va qarz */
function vGoal(){
 let h=`<h2>${gmode=='goal'?'Maqsadlar':'Qarzlar'}</h2>`;
 if(gmode=='goal'){
  h+=`<div class="card"><input id="gn" placeholder="Maqsad nomi (masalan, Noutbuk)">${cpick()}<input id="gt" inputmode="decimal" placeholder="Kerakli summa" style="margin-top:8px"><button class="btn" onclick="addG()">Maqsad qo’shish</button></div>`;
  h+=S.goals.map((g,i)=>{const p=Math.min(100,g.t?g.s/g.t*100:0);return `<div class="card"><div class="row" style="border:0;padding:0"><b class="t">${e(g.n)}</b><button class="x" onclick="rmG(${i})" aria-label="O’chirish">✕</button></div><div class="bar"><div style="width:${p}%"></div></div><div class="mut">${mny(g.s,g.cu)} / ${mny(g.t,g.cu)} (${Math.round(p)}%)</div><div class="add"><input id="g${i}" inputmode="decimal" placeholder="Summa"><button class="btn g" onclick="gAdd(${i})">+ Qo’shish</button></div></div>`}).join('')||'<p class="mut">Hali maqsad yo’q. Birinchisini yuqorida yarating.</p>';
 }else{
  const un=S.debts.filter(d=>!d.p),gv=bc(un.filter(d=>d.w=='gave'),d=>d.a),tk=bc(un.filter(d=>d.w=='took'),d=>d.a);
  h+=`<div class="card"><div class="mut" style="margin-top:0">Menga qaytishi kerak: ${cline(gv,'in')}</div><div class="mut">Men qaytarishim kerak: ${cline(tk,'out')}</div></div>
  <div class="card"><select id="dw"><option value="gave">Men qarz berdim</option><option value="took">Men qarz oldim</option></select><input id="dp" placeholder="Kim bilan">${cpick()}<input id="da" inputmode="decimal" placeholder="Summa" style="margin-top:8px"><button class="btn" onclick="addD()">Qarz qo’shish</button></div>`;
  h+=dsec('took')+dsec('gave');
 }
 return h}
function vBk(){return `<h3>Bulut (hisob)</h3><div class="card"><div id="sy" class="mut" style="margin-top:0">${symsg()}</div><button class="btn g" onclick="syncNow()">Hozir sinxronlash</button></div><h3>Zaxira nusxa</h3><div class="card"><div class="mut" style="margin-top:0">Ma’lumotlar faqat shu telefonda saqlanadi. Brauzer tozalansa yo’qolishi mumkin, shuning uchun vaqti-vaqti bilan nusxa oling.</div><textarea id="bk" style="min-height:70px" placeholder="Nusxa shu yerda chiqadi yoki tiklash uchun shu yerga joylang"></textarea><div class="two"><button class="btn g" onclick="bkOut()">Nusxa olish</button><button class="btn g" onclick="bkIn()">Tiklash</button></div><div class="two" style="margin-top:8px"><button class="btn g" onclick="dlBk()">Faylga yuklab olish</button><label class="btn g" style="text-align:center;cursor:pointer">Fayldan tiklash<input type="file" accept=".json,application/json" hidden onchange="rdBk(this)"></label></div></div>`;
}
function dsec(w){const took=w=='took',L=S.debts.map((d,i)=>[d,i]).filter(([d])=>d.w==w),un=bc(L.filter(([d])=>!d.p).map(x=>x[0]),d=>d.a),pd=bc(L.filter(([d])=>d.p).map(x=>x[0]),d=>d.a);
 return `<h3>${took?'Men olgan qarzlar':'Men bergan qarzlar'}</h3><div class="card"><div class="mut" style="margin-top:0">${took?'Qaytarishim kerak':'Menga qaytishi kerak'}: ${cline(un,took?'out':'in')}</div><div class="mut">${took?'Qaytarib bo’lingan':'Qaytib kelgan'}: ${cline(pd,'')}</div>${L.map(([d,i])=>`<div class="row"><div class="t ${d.p?'dn':''}"><b>${e(d.p0)}</b></div><b class="${took?'out':'in'} ${d.p?'dn':''}">${mny(d.a,d.cu)}</b><button class="x" onclick="pdD(${i})" aria-label="${took?'Qaytarildi':'Qaytdi'}">${d.p?'↩':'✓'}</button><button class="x" onclick="rmD(${i})" aria-label="O’chirish">✕</button></div>`).join('')||'<p class="mut">Yozuv yo’q.</p>'}</div>`}
function addG(){const n=$('#gn').value.trim(),t=num($('#gt').value);if(!n||t<=0){toast('Nom va summani kiriting');return}S.goals.push({n,t,s:0,cu:CC});save();go()}
function gAdd(i){const a=num($('#g'+i).value);if(a<=0)return;S.goals[i].s+=a;save();go();toast('Qo’shildi')}
function rmG(i){S.goals.splice(i,1);save();go()}
function addD(){const p=$('#dp').value.trim(),a=num($('#da').value);if(!p||a<=0){toast('Ism va summani kiriting');return}S.debts.push({w:$('#dw').value,p0:p,a,p:0,cu:CC});save();go()}
function pdD(i){S.debts[i].p=S.debts[i].p?0:1;save();go()}
function rmD(i){S.debts.splice(i,1);save();go()}
function bkOut(){const t=$('#bk');t.value=JSON.stringify(S);t.select();try{navigator.clipboard.writeText(t.value);toast('Nusxa olindi')}catch(x){toast('Matnni belgilab nusxalang')}}
function bkIn(){try{const o=JSON.parse($('#bk').value);if(typeof o!='object'||!o)throw 0;S=Object.assign({diary:{},tasks:{},tx:[],goals:[],debts:[],pr:{},qr:{},qh:{},qz:{},qzl:{},dg:[],dgd:{},al:[],sh:[],bk:[],nb:[],qd:[],zk:[],zc:{},zg:{},rl:[],qs:{}},o);save();go();toast('Tiklandi')}catch(x){toast('Nusxa noto’g’ri')}}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
addEventListener('online',()=>{if(UID)syncAll()});addEventListener('offline',()=>{if(UID)setSync('err')});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState=='visible'&&UID&&!PULLED)syncAll()});
if(PINR())lockNow();
go();initCloud();
</script>
</body>
</html>
