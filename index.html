<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MD Kundalik</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F2F5F9" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#10151D" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="MD Kundalik">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#F2F5F9;--card:#fff;--ink:#16202E;--mut:#6B7686;--ac:#2F4BDB;--acx:#fff;--in:#12805C;--out:#C23B3B;--ln:#DDE3EC;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151D;--card:#19212C;--ink:#E8EDF4;--mut:#93A0B2;--ac:#7B93FF;--acx:#10151D;--in:#4CC9A0;--out:#FF7B7B;--ln:#2A3442;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151D;--card:#19212C;--ink:#E8EDF4;--mut:#93A0B2;--ac:#7B93FF;--acx:#10151D;--in:#4CC9A0;--out:#FF7B7B;--ln:#2A3442;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Onest,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px}
main{max-width:560px;margin:0 auto;padding:16px}
h2{font-size:26px;margin:8px 0 14px;letter-spacing:-.02em}
h3{font-size:16px;margin:22px 0 8px;color:var(--mut);font-weight:500}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;margin-bottom:8px}
textarea{min-height:160px;resize:vertical}
input[type=checkbox]{width:22px;height:22px;margin:0;flex:none}
.btn{font:inherit;font-weight:700;background:var(--ac);color:var(--acx);border:0;border-radius:10px;padding:10px 16px;cursor:pointer}
.btn.g{background:transparent;color:var(--ac);border:1px solid var(--ln)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.moods,.seg,.nav,.add,.two{display:flex;gap:8px;margin-bottom:8px}
.add input,.two>*{margin:0;flex:1}
.mood{font-size:24px;background:var(--bg);border:1px solid var(--ln);border-radius:10px;flex:1;padding:6px;cursor:pointer}
.mood.on,.seg .on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 16%,transparent)}
.seg button{flex:1;font:inherit;padding:9px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--ink);cursor:pointer}
.nav{align-items:center;justify-content:space-between}
.nav button{font-size:20px;width:44px;height:40px;border:1px solid var(--ln);background:var(--card);color:var(--ink);border-radius:10px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px}
.day{font:inherit;font-size:12px;color:var(--mut);background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.day b{font-size:17px;color:var(--ink)}
.day i{font-style:normal;font-size:11px;min-height:14px;color:var(--ac)}
.day.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 16%,transparent)}
.day.td b{text-decoration:underline}
.task,.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--ln)}
.task span,.row .t{flex:1;min-width:0;overflow-wrap:anywhere}
.dn{text-decoration:line-through;color:var(--mut)}
.x{border:0;background:transparent;color:var(--mut);font-size:16px;padding:6px 8px;cursor:pointer}
.mut{color:var(--mut);font-size:14px;margin:6px 0}
.bal{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:0}
.in{color:var(--in)}.out{color:var(--out)}
.bar{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;margin:8px 0}
.bar div{height:100%;background:var(--ac)}
.ent{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;font:inherit;font-size:12px;color:var(--mut);background:transparent;border:0;padding:6px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:22px}
nav button.on{color:var(--ac);font-weight:700}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.s{opacity:1}
body{padding-bottom:104px;background:radial-gradient(circle at 12% -5%,color-mix(in srgb,var(--ac) 26%,transparent),transparent 42%),radial-gradient(circle at 105% 35%,color-mix(in srgb,var(--in) 20%,transparent),transparent 40%),var(--bg);background-attachment:fixed}
.card{background:color-mix(in srgb,var(--card) 68%,transparent);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border:1px solid color-mix(in srgb,#fff 35%,var(--ln));box-shadow:0 8px 24px rgba(20,30,60,.08),inset 0 1px 0 rgba(255,255,255,.5)}
nav{background:color-mix(in srgb,var(--card) 62%,transparent);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);border-top:1px solid color-mix(in srgb,#fff 40%,var(--ln))}
.ic{position:relative;width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:21px;text-shadow:0 2px 3px rgba(0,0,0,.3);background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:inset 0 1.5px 1px rgba(255,255,255,.75),inset 0 -4px 7px rgba(0,0,0,.22),0 6px 12px color-mix(in srgb,var(--c2) 55%,transparent);transition:transform .15s}
.ic::after{content:"";position:absolute;left:3px;right:3px;top:2px;height:45%;border-radius:12px 12px 20px 20px;background:linear-gradient(rgba(255,255,255,.65),rgba(255,255,255,.05))}
nav button.on .ic{transform:translateY(-4px) scale(1.08)}
.mood,.ck.ok,.ck.no{box-shadow:inset 0 1px 1px rgba(255,255,255,.6),inset 0 -2px 4px rgba(0,0,0,.15),0 3px 8px rgba(0,0,0,.15)}
.top{max-width:560px;margin:0 auto;padding:12px 16px 0;display:flex;align-items:center;gap:10px}
.top small{display:block;color:var(--mut);font-size:12px;line-height:1.2}
.md{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;flex:none;border-radius:12px;font-weight:800;font-size:15px;letter-spacing:.5px;color:#fff;background:linear-gradient(145deg,#6EA8FF,#2F4BDB 60%,#1B2E9E);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.7),inset 0 -4px 6px rgba(0,0,0,.25),0 6px 12px rgba(47,75,219,.4);text-shadow:0 1px 2px rgba(0,0,0,.4)}
.md.big{width:56px;height:56px;font-size:21px;border-radius:18px}
#ring{position:fixed;inset:0;z-index:99;background:var(--bg);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}#ring[hidden]{display:none}
#ring .card{width:100%;max-width:360px}#ring .btn{width:100%;margin-top:10px}
.pg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
.pb{font:inherit;font-size:14px;padding:8px 0;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--ink);cursor:pointer}
.pb.r{background:var(--in);border-color:var(--in);color:var(--acx)}.pb.h{background:var(--ac);border-color:var(--ac);color:var(--acx)}.pb.p{border:2px dashed var(--ac)}
.prow{display:flex;align-items:center;gap:12px;width:100%;font:inherit;color:var(--ink);background:transparent;border:0;border-top:1px solid var(--ln);padding:10px 0;text-align:left;cursor:pointer}
.prow i{font-style:normal;font-size:13px;color:var(--mut)}
.prow span.f{flex:1;overflow-wrap:anywhere}
.ck{width:28px;height:28px;flex:none;border-radius:50%;border:2px solid var(--ln);display:inline-flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;background:transparent;color:var(--acx);padding:0;cursor:pointer}
.ck.ok{background:var(--in);border-color:var(--in)}.ck.no{background:var(--out);border-color:var(--out)}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--ln);margin:4px 0}
.dot.f{background:var(--in);border-color:var(--in)}.dot.p{border-color:var(--in);background:linear-gradient(90deg,var(--in) 50%,transparent 50%)}
.bars{display:flex;gap:8px;margin-top:8px}.bars>div{flex:1;text-align:center;font-size:12px;color:var(--mut)}
.bc{height:90px;background:var(--bg);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden;margin-bottom:4px}.bc div{width:100%;background:var(--ac)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:8px 0}
.ch{font-size:12px;color:var(--mut);text-align:center}
.cd{font:inherit;font-size:12px;color:var(--ink);background:var(--bg);border:1px solid transparent;border-radius:12px;padding:4px 0;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.cd span{font-size:20px;line-height:1.3;color:var(--mut)}
.cd.on{border-color:var(--ac)}.cd.td{font-weight:700;color:var(--ac)}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--ln);border-radius:20px;padding:4px 10px;margin:0 6px 6px 0;font-size:14px}
#login{position:fixed;inset:0;z-index:98;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}#login[hidden]{display:none}#login .card{width:100%;max-width:380px;text-align:center}#login .btn{width:100%;margin-top:8px}
</style>
</head>
<body>
<header class="top"><span class="md">MD</span><span><b>MD Kundalik</b><small>shaxsiy kundalik daftar</small></span></header>
<main id="main"></main>
<div id="ring" hidden><div class="card"><div style="font-size:52px">⏰</div><h2 id="rt"></h2><button class="btn" onclick="stopRing(0)">To’xtatish</button><button class="btn g" onclick="stopRing(1)">5 daqiqadan keyin</button></div></div>
<div id="login" hidden><div class="card"><span class="md big" style="margin-bottom:8px">MD</span><h2 style="margin:4px 0">MD Kundalik</h2><p class="mut">Hisob ma’lumotlaringizni bulutda saqlaydi va boshqa telefonda qaytaradi.</p><input id="le" type="email" placeholder="Email" autocomplete="username"><input id="lp" type="password" placeholder="Parol (kamida 6 belgi)" autocomplete="current-password"><p id="lm" class="out" style="min-height:1.2em"></p><button class="btn" onclick="doAuth(0)">Kirish</button><button class="btn g" onclick="doAuth(1)">Ro’yxatdan o’tish</button><button class="x" onclick="resetPw()">Parolni unutdim</button><br><button class="x" onclick="skipLogin()">Hozircha kirmasdan davom etish</button></div></div>
<div id="toast"></div>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s);
let S={diary:{},tasks:{},tx:[],goals:[],debts:[],pr:{},qr:{},qh:{},qz:{},qzl:{},dg:[],dgd:{},al:[],sh:[],bk:[],nb:[]};
try{const r=localStorage.getItem('kd1');if(r)S=Object.assign(S,JSON.parse(r))}catch(x){}
const save=()=>{try{localStorage.setItem('kd1',JSON.stringify(S))}catch(x){}if(DB)push()};
const e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=ymd(new Date());
const money=n=>Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' so’m';
const num=v=>parseFloat(String(v).replace(/\s/g,'').replace(',','.'))||0;
const MON=['yan','fev','mar','apr','may','iyun','iyul','avg','sen','okt','noy','dek'];
const DS=['Du','Se','Chor','Pay','Ju','Sha','Yak'];
const PR=['Tahajjud','Bomdod','Peshin','Asr','Shom','Xufton'];
const MN=['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentabr','Oktabr','Noyabr','Dekabr'];
const score=k=>{const t=S.tasks[k]||[],p=S.pr[k]||{};return (PR.filter(x=>p[x]).length+t.filter(x=>x.d).length)/(6+t.length)};
const CAT={out:['Oziq-ovqat','Transport','Uy-joy','Kiyim','Sog’liq','Ko’ngilochar','Boshqa'],in:['Maosh','Biznes','Sovg’a','Boshqa']};
const mondayOf=s=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return d};
let tab='home',dm='d',wm='w',qb='q',bo=0,qm='r',qj=0,qe=0,hm=today.slice(0,7),ddate=today,cm=today.slice(0,7),q='',tq='',wstart=mondayOf(today),wsel=today,txType='out',gmode='goal';
const CO={home:['#6EA8FF','#2F4BDB'],diary:['#FFB86B','#E8621F'],wal:['#5EE0B0','#12805C'],quran:['#9BE37A','#2E9E4F'],stat:['#C79BFF','#7A3FE0'],acc:['#A9BBCF','#51667E']};
const TABS=[['home','🏠','Bugun'],['diary','📖','Kundalik'],['plan','🗓️','Reja'],['wal','👛','Hamyon'],['goal','🎯','Maqsad']];
TABS.splice(4,1);TABS.splice(2,1);TABS.push(['quran','📗','Qur’on']);TABS.push(['stat','📊','Stats']);TABS.push(['acc','👤','Hisob']);
function toast(m){const t=$('#toast');t.textContent=m;t.className='s';setTimeout(()=>t.className='',1400)}
function go(){
 $('#nav').innerHTML=TABS.map(t=>`<button class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';go();scrollTo(0,0)"><span class="ic" style="--c1:${CO[t[0]][0]};--c2:${CO[t[0]][1]}">${t[1]}</span>${t[2]}</button>`).join('');
 $('#main').innerHTML={home:vHome,diary:()=>dseg()+(dm=='p'?vPlan():dm=='a'?vAlarm():vDiary()),wal:()=>wseg()+(wm=='g'?vGoal():wm=='s'?vShop():vWal()),stat:vStats,quran:()=>qseg()+(qb=='b'?vBooks():vQuran()),acc:vAcc}[tab]();
}
const dseg=()=>`<div class="seg"><button class="${dm=='d'?'on':''}" onclick="dm='d';go()">Kundalik</button><button class="${dm=='p'?'on':''}" onclick="dm='p';go()">Haftalik reja</button><button class="${dm=='a'?'on':''}" onclick="dm='a';go()">Budilnik</button></div>`;
const wseg=()=>`<div class="seg"><button class="${wm=='w'?'on':''}" onclick="wm='w';go()">Hamyon</button><button class="${wm=='g'?'on':''}" onclick="wm='g';go()">Maqsad va qarz</button><button class="${wm=='s'?'on':''}" onclick="wm='s';go()">Bozorlik</button></div>`;
/* Bugun */
const sh=n=>{const d=new Date(wsel+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d)};
function sd(k){wsel=k;wstart=mondayOf(k);hm=k.slice(0,7);go()}
function hmv(n){const [y,m]=hm.split('-').map(Number),d=new Date(y,m-1+n,1);hm=d.getFullYear()+'-'+pad(d.getMonth()+1);go()}
function tPr(p){const o=S.pr[wsel]=S.pr[wsel]||{};o[p]=o[p]?0:1;save();go()}
function vHome(){
 const k=wsel,d=new Date(k+'T00:00:00'),WD=['Yakshanba','Dushanba','Seshanba','Chorshanba','Payshanba','Juma','Shanba'];
 const pr=S.pr[k]||{},tl=S.tasks[k]||[],past=k<today,pd=PR.filter(p=>pr[p]).length,td=tl.filter(t=>t.d).length;
 const dy=S.diary[k]||{},tx=S.tx.filter(x=>x.d==k),sm=t=>tx.filter(x=>x.t==t).reduce((a,x)=>a+x.a,0);
 return `<div class="nav"><button onclick="sd(sh(-1))" aria-label="Oldingi kun">‹</button><div style="text-align:center"><h2 style="margin:0">${WD[d.getDay()]}</h2><div class="mut" style="margin:0">${d.getDate()}-${MON[d.getMonth()]}${k==today?' · bugun':''}</div></div><button onclick="sd(sh(1))" aria-label="Keyingi kun">›</button></div>
 ${k!=today?`<button class="btn g" style="width:100%;margin-bottom:12px" onclick="sd(today)">Bugunga qaytish</button>`:''}
 <div class="card"><b>Namozlar</b> <span class="mut">${pd}/6</span>${PR.map(p=>{const o=pr[p];return `<button class="prow" onclick="tPr('${p}')"><span class="ck ${o?'ok':past?'no':''}">${o?'✓':past?'✕':''}</span><span class="f">${p}</span><i>${o?'o’qildi':past?'o’qilmadi':''}</i></button>`}).join('')}</div>
 ${dgCard(k,past)}${qzCard()}<div class="card"><b>Kundalik ishlar</b> <span class="mut">${td}/${tl.length}</span><div class="add" style="margin:8px 0"><input id="nt" placeholder="Yangi ish" onkeydown="if(event.key=='Enter')addT()"><button class="btn" onclick="addT()">Qo’shish</button></div>${tl.map((t,i)=>`<div class="prow"><button class="ck ${t.d?'ok':past?'no':''}" onclick="tg(${i})" aria-label="Belgilash">${t.d?'✓':past?'✕':''}</button><span class="f ${t.d?'dn':''}">${e(t.x)}</span><i>${t.d?'bajarildi':past?'bajarilmadi':''}</i><button class="x" onclick="rmT(${i})" aria-label="O’chirish">✕</button></div>`).join('')||'<p class="mut">Bu kunga ish rejalanmagan.</p>'}${tl.some(t=>!t.d)?`<button class="btn g" onclick="mvT()">Bajarilmaganlarni ertaga ko’chirish</button>`:''}</div>
 <div class="card"><b>Kundalik yozuvi</b> ${dy.m||''}<p class="mut">${dy.t?e(dy.t.slice(0,120)):'Bu kunga yozuv yo’q.'}</p><button class="btn g" onclick="ddate='${k}';cm='${k.slice(0,7)}';dm='d';tab='diary';go();scrollTo(0,0)">Kundalikni ochish</button></div>
 ${tx.length?`<div class="card"><b>Hamyon</b><p class="mut">Daromad: <b class="in">+${money(sm('in'))}</b> · Xarajat: <b class="out">−${money(sm('out'))}</b> (${tx.length} ta yozuv)</p></div>`:''}
 ${dcal()}`}
function dcal(){
 const [y,mo]=hm.split('-').map(Number),n=new Date(y,mo,0).getDate(),off=(new Date(y,mo-1,1).getDay()+6)%7;
 let c=DS.map(d=>`<div class="ch">${d}</div>`).join('')+'<i></i>'.repeat(off);
 for(let i=1;i<=n;i++){const k=hm+'-'+pad(i),s=score(k);c+=`<button class="cd${k==wsel?' on':''}${k==today?' td':''}" onclick="sd('${k}');scrollTo(0,0)"><span class="dot ${s>=1?'f':s>0?'p':''}"></span>${i}</button>`}
 return `<div class="card"><div class="nav"><button onclick="hmv(-1)" aria-label="Oldingi oy">‹</button><b>${MN[mo-1]} ${y}</b><button onclick="hmv(1)" aria-label="Keyingi oy">›</button></div><div class="cal">${c}</div><div class="mut">To’liq to’ldirilgan kun — to’la nuqta, qisman — yarim nuqta. Kunni bossangiz, tepada o’sha kun ochiladi.</div></div>`}
/* Maqsad, qazo, Qur’on */
const QZ=['Bomdod','Peshin','Asr','Shom','Xufton','Vitr'],qg=p=>S.qz[p]||{t:0,d:0};
const js=n=>n==1?1:20*n-18,je=n=>n==30?604:js(n+1)-1;
function addDg(){const v=$('#dgn').value.trim();if(!v)return;S.dg.push({id:Date.now(),x:v});save();go()}
function tDg(id){const o=S.dgd[wsel]=S.dgd[wsel]||{};o[id]=o[id]?0:1;save();go()}
function rmDg(id){S.dg=S.dg.filter(x=>x.id!=id);save();go()}
function dgCard(k,past){const g=S.dgd[k]||{},dn=S.dg.filter(x=>g[x.id]).length;

}
function dsec(w){const took=w=='took',L=S.debts.map((d,i)=>[d,i]).filter(([d])=>d.w==w),un=L.filter(([d])=>!d.p).reduce((a,[d])=>a+d.a,0),pd=L.filter(([d])=>d.p).reduce((a,[d])=>a+d.a,0);
 return `<h3>${took?'Men olgan qarzlar':'Men bergan qarzlar'}</h3><div class="card"><div class="mut" style="margin-top:0">${took?'Qaytarishim kerak':'Menga qaytishi kerak'}: <b class="${took?'out':'in'}">${money(un)}</b></div><div class="mut">${took?'Qaytarib bo’lingan':'Qaytib kelgan'}: <b>${money(pd)}</b></div>${L.map(([d,i])=>`<div class="row"><div class="t ${d.p?'dn':''}"><b>${e(d.p0)}</b></div><b class="${took?'out':'in'} ${d.p?'dn':''}">${money(d.a)}</b><button class="x" onclick="pdD(${i})" aria-label="${took?'Qaytarildi':'Qaytdi'}">${d.p?'↩':'✓'}</button><button class="x" onclick="rmD(${i})" aria-label="O’chirish">✕</button></div>`).join('')||'<p class="mut">Yozuv yo’q.</p>'}</div>`}
function addG(){const n=$('#gn').value.trim(),t=num($('#gt').value);if(!n||t<=0){toast('Nom va summani kiriting');return}S.goals.push({n,t,s:0});save();go()}
function gAdd(i){const a=num($('#g'+i).value);if(a<=0)return;S.goals[i].s+=a;save();go();toast('Qo’shildi')}
function rmG(i){S.goals.splice(i,1);save();go()}
function addD(){const p=$('#dp').value.trim(),a=num($('#da').value);if(!p||a<=0){toast('Ism va summani kiriting');return}S.debts.push({w:$('#dw').value,p0:p,a,p:0});save();go()}
function pdD(i){S.debts[i].p=S.debts[i].p?0:1;save();go()}
function rmD(i){S.debts.splice(i,1);save();go()}
function bkOut(){const t=$('#bk');t.value=JSON.stringify(S);t.select();try{navigator.clipboard.writeText(t.value);toast('Nusxa olindi')}catch(x){toast('Matnni belgilab nusxalang')}}
function bkIn(){try{const o=JSON.parse($('#bk').value);if(typeof o!='object'||!o)throw 0;S=Object.assign({diary:{},tasks:{},tx:[],goals:[],debts:[],pr:{},qr:{},qh:{},qz:{},qzl:{},dg:[],dgd:{},al:[],sh:[],bk:[],nb:[]},o);save();go();toast('Tiklandi')}catch(x){toast('Nusxa noto’g’ri')}}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
addEventListener('online',()=>{if(UID)syncAll()});addEventListener('offline',()=>{if(UID)setSync('err')});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState=='visible'&&UID&&!PULLED)syncAll()});
go();initCloud();
</script>
