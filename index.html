<style>
:root{--bg:#F2F5F9;--card:#fff;--ink:#16202E;--mut:#6B7686;--ac:#2F4BDB;--acx:#fff;--in:#12805C;--out:#C23B3B;--ln:#DDE3EC;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151D;--card:#19212C;--ink:#E8EDF4;--mut:#93A0B2;--ac:#7B93FF;--acx:#10151D;--in:#4CC9A0;--out:#FF7B7B;--ln:#2A3442;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151D;--card:#19212C;--ink:#E8EDF4;--mut:#93A0B2;--ac:#7B93FF;--acx:#10151D;--in:#4CC9A0;--out:#FF7B7B;--ln:#2A3442;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Onest,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px}
main{max-width:560px;margin:0 auto;padding:16px}
h2{font-size:26px;margin:8px 0 14px;letter-spacing:-.02em}
h3{font-size:16px;margin:22px 0 8px;color:var(--mut);font-weight:500}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;margin-bottom:8px}
textarea{min-height:160px;resize:vertical}
input[type=checkbox]{width:22px;height:22px;margin:0;flex:none}
.btn{font:inherit;font-weight:700;background:var(--ac);color:var(--acx);border:0;border-radius:10px;padding:10px 16px;cursor:pointer}
.btn.g{background:transparent;color:var(--ac);border:1px solid var(--ln)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.moods,.seg,.nav,.add,.two{display:flex;gap:8px;margin-bottom:8px}
.add input,.two>*{margin:0;flex:1}
.mood{font-size:24px;background:var(--bg);border:1px solid var(--ln);border-radius:10px;flex:1;padding:6px;cursor:pointer}
.mood.on,.seg .on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 16%,transparent)}
.seg button{flex:1;font:inherit;padding:9px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--ink);cursor:pointer}
.nav{align-items:center;justify-content:space-between}
.nav button{font-size:20px;width:44px;height:40px;border:1px solid var(--ln);background:var(--card);color:var(--ink);border-radius:10px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px}
.day{font:inherit;font-size:12px;color:var(--mut);background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.day b{font-size:17px;color:var(--ink)}
.day i{font-style:normal;font-size:11px;min-height:14px;color:var(--ac)}
.day.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 16%,transparent)}
.day.td b{text-decoration:underline}
.task,.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--ln)}
.task span,.row .t{flex:1;min-width:0;overflow-wrap:anywhere}
.dn{text-decoration:line-through;color:var(--mut)}
.x{border:0;background:transparent;color:var(--mut);font-size:16px;padding:6px 8px;cursor:pointer}
.mut{color:var(--mut);font-size:14px;margin:6px 0}
.bal{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:0}
.in{color:var(--in)}.out{color:var(--out)}
.bar{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;margin:8px 0}
.bar div{height:100%;background:var(--ac)}
.ent{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;font:inherit;font-size:12px;color:var(--mut);background:transparent;border:0;padding:6px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:22px}
nav button.on{color:var(--ac);font-weight:700}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.s{opacity:1}
body{padding-bottom:104px;background:radial-gradient(circle at 12% -5%,color-mix(in srgb,var(--ac) 26%,transparent),transparent 42%),radial-gradient(circle at 105% 35%,color-mix(in srgb,var(--in) 20%,transparent),transparent 40%),var(--bg);background-attachment:fixed}
.card{background:color-mix(in srgb,var(--card) 68%,transparent);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border:1px solid color-mix(in srgb,#fff 35%,var(--ln));box-shadow:0 8px 24px rgba(20,30,60,.08),inset 0 1px 0 rgba(255,255,255,.5)}
nav{background:color-mix(in srgb,var(--card) 62%,transparent);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);border-top:1px solid color-mix(in srgb,#fff 40%,var(--ln))}
.ic{position:relative;width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:21px;text-shadow:0 2px 3px rgba(0,0,0,.3);background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:inset 0 1.5px 1px rgba(255,255,255,.75),inset 0 -4px 7px rgba(0,0,0,.22),0 6px 12px color-mix(in srgb,var(--c2) 55%,transparent);transition:transform .15s}
.ic::after{content:"";position:absolute;left:3px;right:3px;top:2px;height:45%;border-radius:12px 12px 20px 20px;background:linear-gradient(rgba(255,255,255,.65),rgba(255,255,255,.05))}
nav button.on .ic{transform:translateY(-4px) scale(1.08)}
.mood,.ck.ok,.ck.no{box-shadow:inset 0 1px 1px rgba(255,255,255,.6),inset 0 -2px 4px rgba(0,0,0,.15),0 3px 8px rgba(0,0,0,.15)}
.top{max-width:560px;margin:0 auto;padding:12px 16px 0;display:flex;align-items:center;gap:10px}
.top small{display:block;color:var(--mut);font-size:12px;line-height:1.2}
.md{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;flex:none;border-radius:12px;font-weight:800;font-size:15px;letter-spacing:.5px;color:#fff;background:linear-gradient(145deg,#6EA8FF,#2F4BDB 60%,#1B2E9E);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.7),inset 0 -4px 6px rgba(0,0,0,.25),0 6px 12px rgba(47,75,219,.4);text-shadow:0 1px 2px rgba(0,0,0,.4)}
.md.big{width:56px;height:56px;font-size:21px;border-radius:18px}
#ring{position:fixed;inset:0;z-index:99;background:var(--bg);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}#ring[hidden]{display:none}
#ring .card{width:100%;max-width:360px}#ring .btn{width:100%;margin-top:10px}
.pg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
.pb{font:inherit;font-size:14px;padding:8px 0;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--ink);cursor:pointer}
.pb.r{background:var(--in);border-color:var(--in);color:var(--acx)}.pb.h{background:var(--ac);border-color:var(--ac);color:var(--acx)}.pb.p{border:2px dashed var(--ac)}
.prow{display:flex;align-items:center;gap:12px;width:100%;font:inherit;color:var(--ink);background:transparent;border:0;border-top:1px solid var(--ln);padding:10px 0;text-align:left;cursor:pointer}
.prow i{font-style:normal;font-size:13px;color:var(--mut)}
.prow span.f{flex:1;overflow-wrap:anywhere}
.ck{width:28px;height:28px;flex:none;border-radius:50%;border:2px solid var(--ln);display:inline-flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;background:transparent;color:var(--acx);padding:0;cursor:pointer}
.ck.ok{background:var(--in);border-color:var(--in)}.ck.no{background:var(--out);border-color:var(--out)}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--ln);margin:4px 0}
.dot.f{background:var(--in);border-color:var(--in)}.dot.p{border-color:var(--in);background:linear-gradient(90deg,var(--in) 50%,transparent 50%)}
.bars{display:flex;gap:8px;margin-top:8px}.bars>div{flex:1;text-align:center;font-size:12px;color:var(--mut)}
.bc{height:90px;background:var(--bg);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden;margin-bottom:4px}.bc div{width:100%;background:var(--ac)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:8px 0}
.ch{font-size:12px;color:var(--mut);text-align:center}
.cd{font:inherit;font-size:12px;color:var(--ink);background:var(--bg);border:1px solid transparent;border-radius:12px;padding:4px 0;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.cd span{font-size:20px;line-height:1.3;color:var(--mut)}
.cd.on{border-color:var(--ac)}.cd.td{font-weight:700;color:var(--ac)}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--ln);border-radius:20px;padding:4px 10px;margin:0 6px 6px 0;font-size:14px}
#login{position:fixed;inset:0;z-index:98;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}#login[hidden]{display:none}#login .card{width:100%;max-width:380px;text-align:center}#login .btn{width:100%;margin-top:8px}
.pw{position:relative}.pw input{padding-right:50px}.eye{position:absolute;right:4px;top:0;height:45px;width:44px;border:0;background:transparent;font-size:20px;cursor:pointer}
#login .card .card{box-shadow:none;margin-bottom:12px}

:root{--bg:#EDF5EF;--ink:#12251B;--mut:#5E7366;--ac:#1F9E5A;--in:#13804F;--out:#D1453B;--ln:#D5E3D9}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1511;--card:#14201A;--ink:#E5F2EA;--mut:#8FA89A;--ac:#4FD38E;--acx:#0C1511;--in:#4FD38E;--out:#FF8076;--ln:#243A2E}}
:root[data-theme="dark"]{--bg:#0C1511;--card:#14201A;--ink:#E5F2EA;--mut:#8FA89A;--ac:#4FD38E;--acx:#0C1511;--in:#4FD38E;--out:#FF8076;--ln:#243A2E}
.md{background:linear-gradient(145deg,#79DB86,#1F9E5A 60%,#0B5A3A);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.7),inset 0 -4px 6px rgba(0,0,0,.25),0 6px 12px rgba(31,158,90,.4)}
.ic svg{width:62%;height:62%;filter:drop-shadow(0 2px 1.5px rgba(0,0,0,.3))}.ic.sm{width:36px;height:36px;border-radius:12px}
.acc{background:color-mix(in srgb,var(--card) 68%,transparent);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border:1px solid color-mix(in srgb,#fff 35%,var(--ln));border-radius:14px;margin-bottom:12px;box-shadow:0 8px 24px rgba(20,60,40,.1),inset 0 1px 0 rgba(255,255,255,.5)}
.ah{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;background:transparent;border:0;color:var(--ink);font:inherit;cursor:pointer}
.acc.big{border-width:1.5px}.acc.big .ah{padding:18px 14px}.acc.big .ah b{font-size:20px}.acc.big .ic{width:50px;height:50px;border-radius:17px}
.chev{transition:transform .3s;font-size:18px;color:var(--mut)}.acc.open .chev{transform:rotate(180deg)}
.acc .bd{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}.acc.open .bd{grid-template-rows:1fr}
.acc .bd>div{overflow:hidden;min-height:0;padding:0 14px}.acc.open .bd>div{padding-bottom:12px}
.acc .card{background:transparent;border:0;box-shadow:none;padding:0;backdrop-filter:none;-webkit-backdrop-filter:none}
.md6{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ln);margin-right:4px}.md6.ok{background:var(--in)}.md6.late{background:#E7B416}.md6.qz{background:var(--out)}
.ck.late{background:#E7B416;border-color:#E7B416}.ck.qz{background:var(--out);border-color:var(--out)}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:6px 0}.prow i.out{color:var(--out)}
.dot.q{box-shadow:0 0 0 2px var(--out)}
#login,#lock{background:radial-gradient(120% 38% at 15% 100%,#4E9A3C 0 62%,transparent 63%),radial-gradient(110% 42% at 95% 100%,#6DB24B 0 62%,transparent 63%),radial-gradient(150% 50% at 50% 118%,#3B7F32 0 62%,transparent 63%),linear-gradient(#86B9D1,#F3D7A3 55%,#A6CF72)}
#lock{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}#lock[hidden]{display:none}
#ring{z-index:130}
#login .card,#lock .card{width:100%;max-width:380px;text-align:center;color:#fff;background:rgba(255,255,255,.14);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border:1.5px solid rgba(255,255,255,.55);box-shadow:0 10px 40px rgba(0,0,0,.25)}
#login .mut,#lock .mut,#login h2,#lock h2{color:rgba(255,255,255,.9)}#login .out,#lock .out{color:#FFD2CC}
#login input,#lock input{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.6);border-radius:999px;padding:12px 18px}
#login input::placeholder,#lock input::placeholder{color:rgba(255,255,255,.7)}
#login .btn,#lock .btn{background:linear-gradient(90deg,#B7C21F,#1F9E5A);color:#fff;border-radius:999px}
#login .btn.g,#lock .btn.g{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.55)}
#login .x,#lock .x{color:#fff}.eye{color:#fff}
.pins{display:flex;gap:12px;justify-content:center;margin:12px 0}.pdot{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.85)}.pdot.on{background:#fff}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:8px 0 4px}.kp button{height:60px;border-radius:50%;border:1.5px solid rgba(255,255,255,.55);background:rgba(255,255,255,.14);color:#fff;font:600 22px Onest,system-ui,sans-serif;cursor:pointer}

.tiles{display:flex;gap:10px;margin-bottom:10px}
.tile{display:flex;align-items:center;gap:10px;min-width:0;padding:12px;font:inherit;color:var(--ink);text-align:left;cursor:pointer;background:color-mix(in srgb,var(--card) 68%,transparent);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border:1px solid color-mix(in srgb,#fff 35%,var(--ln));border-radius:16px;box-shadow:0 8px 24px rgba(20,60,40,.1),inset 0 1px 0 rgba(255,255,255,.5);transition:border-color .2s}
.tile.on{border-color:var(--ac);box-shadow:0 0 0 2px color-mix(in srgb,var(--ac) 30%,transparent),0 8px 24px rgba(20,60,40,.12)}
.tile.big{flex:2.3;padding:18px 14px}.tile.big b{font-size:19px}.tile.big .ic{width:50px;height:50px;border-radius:17px}.tile.sm,.tile.eq{flex:1}.tile .ic{flex:none}
.tile .tt{min-width:0;flex:1}.tile .tt b{display:block;overflow-wrap:anywhere}.tile .mut{margin:2px 0 0;font-size:13px}
.pn .bd{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}.pn.open .bd{grid-template-rows:1fr}.pn .bd>div{overflow:hidden;min-height:0}.pn.open{margin-bottom:12px}

.stk{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--ln);margin:8px 0}.stk i{display:block;height:100%}
.mx{color:var(--out);font-size:14px;margin-top:4px;overflow-wrap:anywhere}
.acc .card.sc{border-left:5px solid var(--sc);padding:8px 12px;margin-bottom:10px;background:color-mix(in srgb,var(--sc) 9%,transparent);border-radius:12px}
.bc div{background:var(--ac)}
</style>
</head>
<body>
<header class="top"><span class="md">MD</span><span><b>MD Kundalik</b><small>shaxsiy kundalik daftar</small></span></header>
<div id="ib"></div>
<main id="main"></main>
<div id="ring" hidden><div class="card"><div style="font-size:52px">⏰</div><h2 id="rt"></h2><button class="btn" onclick="stopRing(0)">To’xtatish</button><button class="btn g" onclick="stopRing(1)">5 daqiqadan keyin</button></div></div>
<div id="login" hidden><div class="card"><div id="lib"></div><span class="md big" style="margin-bottom:8px">MD</span><h2 style="margin:4px 0">MD Kundalik</h2><p class="mut">Ma’lumotlaringiz hisobingizda saqlanadi va istalgan telefonda qaytadi.</p><button class="btn" onclick="doGoogle()">Google hisobi bilan davom etish</button><div class="mut" style="margin:12px 0 6px">yoki email bilan</div><input id="le" type="email" placeholder="Email" autocomplete="username"><div class="pw"><input id="lp" type="password" placeholder="Parol (kamida 6 belgi)" autocomplete="current-password"><button type="button" class="eye" onclick="tgPw()" aria-label="Parolni ko’rsatish yoki yashirish">👁</button></div><p id="lm" class="out" style="min-height:1.2em"></p><button class="btn" onclick="doAuth(0)">Kirish</button><button class="btn g" onclick="doAuth(1)">Ro’yxatdan o’tish</button><p class="mut" style="font-size:13px">Birinchi marta bo’lsangiz “Ro’yxatdan o’tish”ni bosing. Parol Gmail parolingiz emas, ilova uchun yangi o’ylab topiladi.</p><button class="x" onclick="resetPw()">Parolni unutdim</button><br><button class="x" onclick="skipLogin()">Yopish</button></div></div>
<div id="lock" hidden><div class="card"><span class="md big" style="margin-bottom:6px">MD</span><h2 style="margin:4px 0">MD Kundalik</h2><p class="mut" style="margin:0">PIN kiriting</p><div class="pins" id="pd"></div><p id="lmsg" class="out" style="min-height:1.3em;margin:0"></p><div class="kp" id="kp"></div><button class="x" onclick="forgot()">PINni unutdim</button><div id="fg" hidden><input id="fgp" type="password" placeholder="Hisob paroli (Google bilan kirgan bo’lsangiz bo’sh qoldiring)"><button class="btn" onclick="fgAcc()">Hisob orqali tiklash</button><button class="btn g" onclick="fgMail()">Hisob parolini emailga yuborish</button><button class="btn g" onclick="fgOut()">Chiqib, boshqa hisob bilan kirish</button><button class="x" onclick="fgWipe()">Ilovani tozalash (hisobsiz)</button></div></div></div>
<div id="toast"></div>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s);
let S={diary:{},tasks:{},tx:[],goals:[],debts:[],pr:{},qr:{},qh:{},qz:{},qzl:{},dg:[],dgd:{},al:[],sh:[],bk:[],nb:[],qd:[]};
try{const r=localStorage.getItem('kd1');if(r)S=Object.assign(S,JSON.parse(r))}catch(x){}
const save=()=>{try{localStorage.setItem('kd1',JSON.stringify(S))}catch(x){}if(DB)push()};
const e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=ymd(new Date());
const money=n=>Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' so’m';
const num=v=>parseFloat(String(v).replace(/\s/g,'').replace(',','.'))||0;
const MON=['yan','fev','mar','apr','may','iyun','iyul','avg','sen','okt','noy','dek'];
const DS=['Du','Se','Chor','Pay','Ju','Sha','Yak'];
const PR=['Tahajjud','Bomdod','Peshin','Asr','Shom','Xufton'];
const MN=['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentabr','Oktabr','Noyabr','Dekabr'];
const score=k=>{const t=S.tasks[k]||[],p=S.pr[k]||{};return (PR.filter(x=>p[x]).length+t.filter(x=>x.d).length)/(6+t.length)};

function d3(b,l,r){const o={};for(const k of new Set([...Object.keys(b),...Object.keys(l),...Object.keys(r)])){const B=JSON.stringify(b[k]),L=JSON.stringify(l[k]),R=JSON.stringify(r[k]);let v;if(L===B)v=r[k];else if(R===B)v=l[k];else v=r[k]!==undefined?r[k]:l[k];if(v!==undefined)o[k]=v}return o}

 for(const k of new Set([...mb.keys(),...ml.keys(),...mr.keys()])){const B=J(mb,k),L=J(ml,k),R=J(mr,k);let v;if(L===B)v=mr.get(k);else if(R===B)v=ml.get(k);else v=mr.has(k)?mr.get(k):ml.get(k);if(v!==undefined)o.push(v)}return o}

const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function hashPin(p,s){return b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+':'+p)))}
const PINR=()=>{try{return JSON.parse(localStorage.getItem('kdpin')||'null')}catch(x){return null}},BIO=()=>{try{return localStorage.getItem('kdbio')}catch(x){return null}};
let LK={on:false,buf:'',fails:0,until:0,away:0};
function lockNow(){if(!PINR())return;LK.buf='';LK.on=true;renderLock();$('#lock').hidden=false;$('#fg').hidden=true;$('#lmsg').textContent='';if(BIO())setTimeout(bioUnlock,350)}
function unlock(){LK.on=false;LK.fails=0;LK.buf='';$('#lock').hidden=true}
function renderLock(){const r=PINR(),n=r?r.n:4;$('#pd').innerHTML=Array.from({length:n},(_,i)=>`<i class="pdot${i<LK.buf.length?' on':''}"></i>`).join('');
 $('#kp').innerHTML=['1','2','3','4','5','6','7','8','9'].map(d=>`<button onclick="kk('${d}')">${d}</button>`).join('')+`<button onclick="bioUnlock()" ${BIO()?'':'style="visibility:hidden"'} aria-label="Biometrik">👆</button><button onclick="kk('0')">0</button><button onclick="kb()" aria-label="O’chirish">⌫</button>`}
async function kk(d){const r=PINR(),m=$('#lmsg');if(!r)return;if(Date.now()<LK.until){m.textContent='Biroz kuting ('+Math.ceil((LK.until-Date.now())/1000)+' soniya)';return}
 if(LK.buf.length>=r.n)return;LK.buf+=d;renderLock();
 if(LK.buf.length==r.n){if(await hashPin(LK.buf,r.s)===r.h){m.textContent='';unlock()}else{LK.fails++;LK.buf='';m.textContent=LK.fails>=5?'Juda ko’p xato. 30 soniya kuting.':'PIN noto’g’ri';if(LK.fails>=5){LK.until=Date.now()+30000;LK.fails=0}if(navigator.vibrate)navigator.vibrate(200);renderLock()}}}
function kb(){LK.buf=LK.buf.slice(0,-1);renderLock()}
async function bioUnlock(){const id=BIO();if(!id||!navigator.credentials)return;try{await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:ub64(id)}],userVerification:'required',timeout:60000}});unlock()}catch(x){}}
async function bioSet(on){if(!on){try{localStorage.removeItem('kdbio')}catch(x){}go();return}
 try{const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'MD Kundalik'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'md-kundalik',displayName:'MD Kundalik'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});localStorage.setItem('kdbio',b64(c.rawId));go();toast('Biometrik yoqildi')}catch(x){toast('Biometrik yoqilmadi: telefon qo’llamaydi yoki rad etildi')}}
async function pinSave(){const r=PINR(),a=$('#pn1').value,b=$('#pn2').value,m=$('#pmsg');

 if(!/^\d{4,6}$/.test(a)){m.textContent='PIN 4-6 raqam bo’lsin';return}
 if(a!==b){m.textContent='PIN’lar bir xil emas';return}
 const s=b64(crypto.getRandomValues(new Uint8Array(8)));try{localStorage.setItem('kdpin',JSON.stringify({s,h:await hashPin(a,s),n:a.length}))}catch(x){m.textContent='Saqlab bo’lmadi';return}go();toast('PIN saqlandi')}

 const ea=Object.entries(ex).sort((a,b)=>b[1]-a[1]);
 return `<div class="seg">${[['7','7 kun'],['m','Shu oy'],['a','Hammasi']].map(([k,l])=>`<button class="${SP==k?'on':''}" onclick="SP='${k}';go()">${l}</button>`).join('')}</div>
 ${sc('#1F9E5A','Umumiy bajarilish',`<div style="font-size:30px;font-weight:700">${pc(done,all)}%</div>${bar2([[done,'#1F9E5A'],[missed,RED]])}${lgd([[done,'#1F9E5A','Bajarildi'],[missed,RED,'Bajarilmadi']])}${miss(missed,'bajarilmagan amallar')}<div class="mut">Ketma-ket to’liq namoz kunlari: <b>${st}</b></div>`)}
 <div class="card"><b>Oxirgi 7 kun</b><div class="bars">${w.map(([a,s])=>`<div><div class="bc"><div style="height:${Math.round(s*100)}%"></div></div>${a}</div>`).join('')}</div></div>
 ${sc('#2EA043','Namozlar',`${bar2([[c1,'#2EA043'],[c2,'#E7B416'],[c3,RED],[pm,GRY]])}${lgd([[c1,'#2EA043','Vaqtida'],[c2,'#E7B416','Kechikkan'],[c3,RED,'Qazo o’qilgan'],[pm,GRY,'Belgilanmagan']])}${miss(pm,'o’qilmagan namozlar')}`)}
 ${sc('#0EA5A5','Qazo namozlar',`${bar2([[qd,'#0EA5A5'],[Math.max(0,qt-qd),'var(--ln)']])}<div class="mut">Umumiy son bo’yicha qoldi: <b>${qt-qd}</b> · sana bo’yicha qoldi: <b>${qo}</b> · shu davrda o’qilgan: <b>${qr}</b></div>${miss(qt-qd+qo,'hali o’qilmagan qazo')}`)}
 ${sc('#3B82F6','Kunlik ishlar',`${bar2([[tD,'#3B82F6'],[tM,RED],[tT-tD-tM,'var(--ln)']])}${lgd([[tD,'#3B82F6','Bajarildi'],[tM,RED,'Bajarilmadi']])}${mt.slice(-5).map(x=>`<div class="mx">✕ ${e(x)}</div>`).join('')}`)}
 ${sc('#F59E0B','Kunlik maqsadlar',gS||'<div class="mut">Maqsad kiritilmagan.</div>')}
 ${sc('#8B5CF6','Mutolaa',`<div class="mut">Qur’on: <b>${R}/604</b> bet o’qilgan · <b>${H}/604</b> yod olingan</div>${bar2([[R,'#8B5CF6'],[604-R,'var(--ln)']])}<div class="mut">Kitoblar: o’qilayotgan <b>${S.bk.filter(b=>!b.en).length}</b> · tugatilgan <b>${S.bk.filter(b=>b.en).length}</b> · shu davrda <b>${bp}</b> bet</div>`)}
 ${sc('#EC4899','Kundalik yozuvlari',`<div class="mut"><b>${dn.length}</b> kun yozilgan, <b>${days.length-dn.length}</b> kun yozilmagan</div>${bar2([[dn.length,'#EC4899'],[days.length-dn.length,'var(--ln)']])}<div>${Object.entries(md).map(([m,c])=>`<span class="chip">${m} ${c}×</span>`).join('')}</div>`)}
 ${sc('#F97316','Hamyon',`<div class="mut">Daromad: <b class="in">+${money(inc)}</b> · Xarajat: <b class="out">−${money(exp)}</b> · Balans: <b>${money(bal)}</b></div>${bar2([[inc,'#16A34A'],[exp,'#F97316']])}${ea.map(([c,a])=>`<div class="mut" style="margin:6px 0 0">${e(c)}: <b>${money(a)}</b></div>${bar2([[a,'#F97316'],[exp-a,'var(--ln)']])}`).join('')}`)}
 ${sc('#E11D48','Qarzlar',`<div class="mut">Men qaytarishim kerak: <b class="out">${money(took)}</b></div><div class="mut">Menga qaytishi kerak: <b class="in">${money(gave)}</b></div>${miss(ud.length,'qaytarilmagan qarz yozuvlari')}`)}
 ${sc('#64748B','Bozorlik',`${bar2([[shD,'#64748B'],[shT-shD,'var(--ln)']])}<div class="mut">Jami <b>${money(shT)}</b> · olingan <b>${money(shD)}</b> · qolgan <b>${money(shT-shD)}</b></div>`)}`}
/* Kundalik */
function vDiary(){
 const d=S.diary[ddate]||{t:'',m:''};
 const ql=q.toLowerCase();const ks=Object.keys(S.diary).filter(k=>k!=ddate&&(S.diary[k].t||S.diary[k].m)&&(!ql||(k+S.diary[k].t).toLowerCase().includes(ql))).sort().reverse();
 return `<h2>Kundalik</h2>${cal()}${dayPr()}<div class="card" id="ed"><input type="date" id="dd" value="${ddate}" onchange="ddate=this.value||today;cm=ddate.slice(0,7);go()">
 <div class="moods">${['😄','🙂','😐','😔','😡'].map(m=>`<button class="mood${d.m==m?' on':''}" onclick="setMood('${m}')">${m}</button>`).join('')}</div>
 <textarea id="dt" placeholder="Bugun nima bo’ldi? Nima haqida o’ylayapsiz?">${e(d.t)}</textarea>
 <button class="btn" onclick="saveD()">Saqlash</button></div>
 <h3>Oldingi yozuvlar</h3><input type="search" placeholder="Yozuvlardan qidirish" value="${e(q)}" onchange="q=this.value.trim();go()">${ks.length?ks.map(k=>`<button class="ent" onclick="ddate='${k}';go();scrollTo(0,0)"><b>${k}</b> ${S.diary[k].m||''}<div class="mut">${e(S.diary[k].t.slice(0,90))}</div></button>`).join(''):'<p class="mut">Boshqa yozuv yo’q. Yuqorida bugungi kunni yozing va saqlang.</p>'}`;
}
function cal(){
 const [y,mo]=cm.split('-').map(Number),n=new Date(y,mo,0).getDate(),off=(new Date(y,mo-1,1).getDay()+6)%7;
 
 const cnt={};let cells=DS.map(d=>`<div class="ch">${d}</div>`).join('')+'<i></i>'.repeat(off);
 for(let i=1;i<=n;i++){const k=cm+'-'+pad(i),d=S.diary[k]||{},m=d.m;if(m)cnt[m]=(cnt[m]||0)+1;
  cells+=`<button class="cd${k==ddate?' on':''}${k==today?' td':''}" onclick="ddate='${k}';OP.d=1;go();$('#acd').scrollIntoView({behavior:'smooth'})"><span>${m||(d.t?'•':'+')}</span>${i}</button>`}
 const st=Object.keys(cnt).map(m=>`<span class="chip">${m} ${cnt[m]}×</span>`).join('')||'<span class="mut">Bu oyda kayfiyat belgilanmagan.</span>';
 return `<div class="card"><div class="nav"><button onclick="cmv(-1)" aria-label="Oldingi oy">‹</button><b>${MN[mo-1]} ${y}</b><button onclick="cmv(1)" aria-label="Keyingi oy">›</button></div><div class="cal">${cells}</div><div class="mut">Shu oydagi kayfiyatlar:</div><div>${st}</div></div>`}
function cmv(n){const [y,m]=cm.split('-').map(Number),d=new Date(y,m-1+n,1);cm=d.getFullYear()+'-'+pad(d.getMonth()+1);go()}
function setMood(m){const o=S.diary[ddate]||{t:'',m:''};S.diary[ddate]={t:$('#dt').value,m:o.m==m?'':m};save();go()}
function saveD(){const o=S.diary[ddate]||{m:''};const t=$('#dt').value;if(!t.trim()&&!o.m)delete S.diary[ddate];else S.diary[ddate]={t,m:o.m||''};save();toast('Saqlandi');go()}
/* Reja */
function vPlan(){
 const days=[...Array(7)].map((_,i)=>{const d=new Date(wstart);d.setDate(d.getDate()+i);return d});
 const list=S.tasks[wsel]||[],dn=list.filter(t=>t.d).length;
 const sd=new Date(wsel+'T00:00:00');
 return `<h2>Haftalik reja</h2><input type="search" placeholder="Vazifalarni qidirish" value="${e(tq)}" onchange="tq=this.value.trim();go()">${tq?tres():''}<div class="nav"><button onclick="wk(-7)" aria-label="Oldingi hafta">‹</button><b>${days[0].getDate()} ${MON[days[0].getMonth()]} – ${days[6].getDate()} ${MON[days[6].getMonth()]}</b><button onclick="wk(7)" aria-label="Keyingi hafta">›</button></div>
 <div class="week">${days.map((d,i)=>{const k=ymd(d),o=(S.tasks[k]||[]).filter(t=>!t.d).length;return `<button class="day${k==wsel?' on':''}${k==today?' td':''}" onclick="wsel='${k}';go()">${DS[i]}<b>${d.getDate()}</b><i>${o||''}</i></button>`}).join('')}</div>
 <div class="card"><div class="mut" style="margin-top:0">${sd.getDate()} ${MON[sd.getMonth()]} uchun vazifalar</div>
 <div class="add"><input id="nt" placeholder="Yangi vazifa" onkeydown="if(event.key=='Enter')addT()"><button class="btn" onclick="addT()">Qo’shish</button></div>
 ${list.map((t,i)=>`<div class="task"><input type="checkbox" ${t.d?'checked':''} onchange="tg(${i})"><span class="${t.d?'dn':''}">${e(t.x)}</span><button class="x" onclick="rmT(${i})" aria-label="O’chirish">✕</button></div>`).join('')||'<p class="mut">Bu kunga vazifa yo’q.</p>'}
 ${list.length?`<p class="mut">${dn}/${list.length} bajarildi</p><button class="btn g" onclick="mvT()">Bajarilmaganlarni ertaga ko’chirish</button>`:''}</div>`;
}
function mvT(){const d=new Date(wsel+'T00:00:00');d.setDate(d.getDate()+1);const k=ymd(d),l=S.tasks[wsel]||[],u=l.filter(t=>!t.d);if(!u.length){toast('Ko’chiriladigan vazifa yo’q');return}S.tasks[wsel]=l.filter(t=>t.d);(S.tasks[k]=S.tasks[k]||[]).push(...u);save();go();toast(u.length+' ta vazifa ertaga ko’chirildi')}
function tres(){const ql=tq.toLowerCase(),r=[];Object.keys(S.tasks).sort().reverse().forEach(k=>S.tasks[k].forEach(t=>{if(t.x.toLowerCase().includes(ql))r.push([k,t])}));return `<div class="card">${r.slice(0,30).map(([k,t])=>`<button class="ent" onclick="wsel='${k}';wstart=mondayOf(k);tq='';go()"><b>${k}</b> <span class="${t.d?'dn':''}">${e(t.x)}</span></button>`).join('')||'<p class="mut">Hech narsa topilmadi.</p>'}</div>`}
function wk(n){wstart.setDate(wstart.getDate()+n);wsel=ymd(wstart);go()}
function addT(){const v=$('#nt').value.trim();if(!v)return;(S.tasks[wsel]=S.tasks[wsel]||[]).push({x:v,d:0});save();go();$('#nt').focus()}
function tg(i){S.tasks[wsel][i].d=S.tasks[wsel][i].d?0:1;save();go()}
function rmT(i){S.tasks[wsel].splice(i,1);save();go()}
/* Hamyon */
function vWal(){
 const m=today.slice(0,7),sum=(t,f)=>S.tx.filter(x=>x.t==t&&f(x)).reduce((a,x)=>a+x.a,0);
 const bal=sum('in',()=>1)-sum('out',()=>1),mi=sum('in',x=>x.d.startsWith(m)),mo=sum('out',x=>x.d.startsWith(m));
 const L=[...S.tx].sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id).slice(0,40);
 return `<h2>Hamyon</h2><div class="card"><div class="mut" style="margin-top:0">Umumiy balans</div><p class="bal ${bal<0?'out':''}">${money(bal)}</p>
 <div class="mut">Shu oy: <b class="in">+${money(mi)}</b> · <b class="out">−${money(mo)}</b></div></div>
 <div class="card"><div class="seg"><button class="${txType=='out'?'on':''}" onclick="txType='out';go()">Xarajat</button><button class="${txType=='in'?'on':''}" onclick="txType='in';go()">Daromad</button></div>
 <input id="ta" inputmode="decimal" placeholder="Summa (so’m)"><div class="two"><select id="tc">${CAT[txType].map(c=>`<option>${c}</option>`).join('')}</select><input type="date" id="td" value="${today}"></div>
 <input id="tn" placeholder="Izoh (ixtiyoriy)" style="margin-top:8px"><button class="btn" onclick="addTx()">Qo’shish</button></div>
 <h3>So’nggi yozuvlar</h3>${L.map(x=>`<div class="row"><div class="t"><b>${e(x.c)}</b> <span class="mut">${x.d}${x.n?' · '+e(x.n):''}</span></div><b class="${x.t}">${x.t=='in'?'+':'−'}${money(x.a)}</b><button class="x" onclick="rmTx(${x.id})" aria-label="O’chirish">✕</button></div>`).join('')||'<p class="mut">Hali yozuv yo’q. Birinchi daromad yoki xarajatni qo’shing.</p>'}`;
}
function addTx(){const a=num($('#ta').value);if(a<=0){toast('Summani kiriting');return}S.tx.push({id:Date.now(),t:txType,a,c:$('#tc').value,n:$('#tn').value.trim(),d:$('#td').value||today});save();go();toast('Qo’shildi')}
function rmTx(id){S.tx=S.tx.filter(x=>x.id!=id);save();go()}
/* Maqsad va qarz */
function vGoal(){
 let h=`<h2>${gmode=='goal'?'Maqsadlar':'Qarzlar'}</h2>`;
 if(gmode=='goal'){
  h+=`<div class="card"><input id="gn" placeholder="Maqsad nomi (masalan, Noutbuk)"><input id="gt" inputmode="decimal" placeholder="Kerakli summa"><button class="btn" onclick="addG()">Maqsad qo’shish</button></div>`;
  h+=S.goals.map((g,i)=>{const p=Math.min(100,g.t?g.s/g.t*100:0);return `<div class="card"><div class="row" style="border:0;padding:0"><b class="t">${e(g.n)}</b><button class="x" onclick="rmG(${i})" aria-label="O’chirish">✕</button></div><div class="bar"><div style="width:${p}%"></div></div><div class="mut">${money(g.s)} / ${money(g.t)} (${Math.round(p)}%)</div><div class="add"><input id="g${i}" inputmode="decimal" placeholder="Summa"><button class="btn g" onclick="gAdd(${i})">+ Qo’shish</button></div></div>`}).join('')||'<p class="mut">Hali maqsad yo’q. Birinchisini yuqorida yarating.</p>';
 }else{
  const un=S.debts.filter(d=>!d.p),gv=un.filter(d=>d.w=='gave').reduce((a,d)=>a+d.a,0),tk=un.filter(d=>d.w=='took').reduce((a,d)=>a+d.a,0);
  h+=`<div class="card"><div class="mut" style="margin-top:0">Menga qaytishi kerak: <b class="in">${money(gv)}</b></div><div class="mut">Men qaytarishim kerak: <b class="out">${money(tk)}</b></div></div>
  <div class="card"><select id="dw"><option value="gave">Men qarz berdim</option><option value="took">Men qarz oldim</option></select><input id="dp" placeholder="Kim bilan"><input id="da" inputmode="decimal" placeholder="Summa"><button class="btn" onclick="addD()">Qarz qo’shish</button></div>`;
  h+=dsec('took')+dsec('gave');
 }
 return h}
function vBk(){return `<h3>Bulut (hisob)</h3><div class="card"><div id="sy" class="mut" style="margin-top:0">${symsg()}</div><button class="btn g" onclick="syncNow()">Hozir sinxronlash</button></div><h3>Zaxira nusxa</h3><div class="card"><div class="mut" style="margin-top:0">Ma’lumotlar faqat shu telefonda saqlanadi. Brauzer tozalansa yo’qolishi mumkin, shuning uchun vaqti-vaqti bilan nusxa oling.</div><textarea id="bk" style="min-height:70px" placeholder="Nusxa shu yerda chiqadi yoki tiklash uchun shu yerga joylang"></textarea><div class="two"><button class="btn g" onclick="bkOut()">Nusxa olish</button><button class="btn g" onclick="bkIn()">Tiklash</button></div><div class="two" style="margin-top:8px"><button class="btn g" onclick="dlBk()">Faylga yuklab olish</button><label class="btn g" style="text-align:center;cursor:pointer">Fayldan tiklash<input type="file" accept=".json,application/json" hidden onchange="rdBk(this)"></label></div></div>`;
}
function dsec(w){const took=w=='took',L=S.debts.map((d,i)=>[d,i]).filter(([d])=>d.w==w),un=L.filter(([d])=>!d.p).reduce((a,[d])=>a+d.a,0),pd=L.filter(([d])=>d.p).reduce((a,[d])=>a+d.a,0);
 return `<h3>${took?'Men olgan qarzlar':'Men bergan qarzlar'}</h3><div class="card"><div class="mut" style="margin-top:0">${took?'Qaytarishim kerak':'Menga qaytishi kerak'}: <b class="${took?'out':'in'}">${money(un)}</b></div><div class="mut">${took?'Qaytarib bo’lingan':'Qaytib kelgan'}: <b>${money(pd)}</b></div>${L.map(([d,i])=>`<div class="row"><div class="t ${d.p?'dn':''}"><b>${e(d.p0)}</b></div><b class="${took?'out':'in'} ${d.p?'dn':''}">${money(d.a)}</b><button class="x" onclick="pdD(${i})" aria-label="${took?'Qaytarildi':'Qaytdi'}">${d.p?'↩':'✓'}</button><button class="x" onclick="rmD(${i})" aria-label="O’chirish">✕</button></div>`).join('')||'<p class="mut">Yozuv yo’q.</p>'}</div>`}
function addG(){const n=$('#gn').value.trim(),t=num($('#gt').value);if(!n||t<=0){toast('Nom va summani kiriting');return}S.goals.push({n,t,s:0});save();go()}
function gAdd(i){const a=num($('#g'+i).value);if(a<=0)return;S.goals[i].s+=a;save();go();toast('Qo’shildi')}
function rmG(i){S.goals.splice(i,1);save();go()}
function addD(){const p=$('#dp').value.trim(),a=num($('#da').value);if(!p||a<=0){toast('Ism va summani kiriting');return}S.debts.push({w:$('#dw').value,p0:p,a,p:0});save();go()}
function pdD(i){S.debts[i].p=S.debts[i].p?0:1;save();go()}
function rmD(i){S.debts.splice(i,1);save();go()}
function bkOut(){const t=$('#bk');t.value=JSON.stringify(S);t.select();try{navigator.clipboard.writeText(t.value);toast('Nusxa olindi')}catch(x){toast('Matnni belgilab nusxalang')}}
function bkIn(){try{const o=JSON.parse($('#bk').value);if(typeof o!='object'||!o)throw 0;S=Object.assign({diary:{},tasks:{},tx:[],goals:[],debts:[],pr:{},qr:{},qh:{},qz:{},qzl:{},dg:[],dgd:{},al:[],sh:[],bk:[],nb:[],qd:[]},o);save();go();toast('Tiklandi')}catch(x){toast('Nusxa noto’g’ri')}}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
addEventListener('online',()=>{if(UID)syncAll()});addEventListener('offline',()=>{if(UID)setSync('err')});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState=='visible'&&UID&&!PULLED)syncAll()});
if(PINR())lockNow();
go();initCloud();
</script>
</body>
</html>
